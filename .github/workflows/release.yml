name: build-and-release
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/

      - name: Upload artifacts to Modrinth and GitHub
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          #          modrinth-id: <id>
          #          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          #          modrinth-featured: true

          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: build/libs/!(*-@(dev|sources|all)).jar
          version-type: release
          loaders: fabric quilt
          game-version-filter: releases
      - name: Setup Modman
        uses: ThatCuteOne/setup-modman@v2
        with:
          version: v1.11.1
      -  name: Update Modman Manifest
         id: modman-update-manifest
         run: |
           git pull origin master
           git switch master
           modman manifest release $(git describe --tags) 26.3
           
           git config user.name "github-actions[bot]"
           git config user.email "github-actions[bot]@users.noreply.github.com"
           git add .
           git commit -m "Update modman manifest for release $(git describe --tags)"
           git push